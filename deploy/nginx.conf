# Konfigurasi contoh untuk Jurnal PKL (server block BARU).
# Salin ke /etc/nginx/sites-available/jurnalpkl lalu sesuaikan DOMAIN_ANDA.
# JANGAN menimpa konfigurasi layanan lain (mis. Elmira VC) di VPS.
#
# Batas unggah: 3 foto per jurnal × 5 MB per foto, dengan ruang headroom →
# client_max_body_size 25m (selaras dengan validasi aplikasi).
server {
    listen 80;
    server_name DOMAIN_ANDA;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
